name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI and dependencies
        run: npm install --no-save @capacitor/cli@6.1.2 @capacitor/core@6.1.2 @capacitor/android@6.1.2

      - name: Copy web assets to Android
        run: npx cap copy android --inline

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
          JAVA_TOOL_OPTIONS: "-Xmx3g"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --warning-mode all 2>&1 | tail -200

      - name: Localizar APK gerado
        id: find_apk
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "APK encontrado: $APK"

      - name: Deletar release anterior (se existir)
        if: steps.find_apk.outputs.apk != ''
        run: |
          gh release delete latest-apk --yes 2>/dev/null || true
          git push origin --delete latest-apk 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar APK como Release público
        if: steps.find_apk.outputs.apk != ''
        run: |
          gh release create latest-apk \
            --title "✅ APK-Builder5 — APK mais recente" \
            --notes "APK gerado automaticamente. Clique no arquivo .apk abaixo para baixar e instalar." \
            --latest \
            "${{ steps.find_apk.outputs.apk }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
